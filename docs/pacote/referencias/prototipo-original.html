<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ImobiInsight — Protótipo piloto</title>
  <style>
    :root{
      --bg:#f4f4f5;
      --card:#ffffff;
      --line:#d9d9dc;
      --soft:#ececef;
      --muted:#666a70;
      --text:#111214;
      --text-soft:#3d4044;
      --dark:#57595c;
      --dark-2:#7d8086;
      --ok:#6f826b;
      --shadow:0 1px 3px rgba(0,0,0,.05);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
    .sidebar{background:linear-gradient(180deg,#f1f1f2 0%, #f7f7f8 100%);border-right:1px solid var(--line);padding:24px 10px}
    .logo{font-size:30px;font-weight:800;letter-spacing:-1.4px;padding:0 18px 18px}
    .nav{display:flex;flex-direction:column;gap:6px;margin-top:8px}
    .nav-btn{border:0;background:transparent;border-radius:12px;padding:14px 14px;display:flex;align-items:center;gap:14px;color:#2d3136;font-size:18px;text-align:left}
    .nav-btn:hover{background:#ececee}
    .nav-btn.active{background:linear-gradient(180deg,#67696d,#5b5d61);color:#fff;box-shadow:var(--shadow)}
    .nav-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.6)}
    .nav-btn.active .nav-ico{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.12)}

    .main{min-width:0}
    .topbar{height:108px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:18px 26px;background:linear-gradient(180deg,#f6f6f7 0%, #f4f4f5 100%)}
    .search-wrap{flex:1;display:flex;align-items:center;gap:12px;background:#f7f7f8;border:1px solid #cfd0d3;border-radius:14px;padding:14px 18px;max-width:780px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
    .search-wrap input{border:0;background:transparent;outline:none;width:100%;font-size:18px;color:var(--text-soft)}
    .top-select{border:1px solid #cfd0d3;border-radius:14px;background:#fafafa;padding:14px 16px;min-width:220px;font-size:17px;color:#2e3135}
    .top-icons{margin-left:auto;display:flex;align-items:center;gap:18px}
    .round-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
    .avatar{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}
    .avatar .circle{width:46px;height:46px;border-radius:50%;background:#8e8f92;color:#fff;display:grid;place-items:center;font-weight:700}

    .content{padding:18px 18px 30px}
    .page{display:none}
    .page.active{display:block}
    .hero{padding:0 10px 6px}
    h1{font-size:40px;line-height:1.05;letter-spacing:-1.3px;margin:0 0 4px}
    .subtitle{font-size:19px;color:#4e5257;margin:0 0 18px}
    .grid{display:grid;gap:18px}
    .kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
    .two-col{grid-template-columns:1.15fr 1.15fr 1fr;margin-bottom:18px}
    .bottom-grid{grid-template-columns:1.75fr 1.05fr}
    .stack{display:grid;gap:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow)}
    .card-title{font-size:18px;font-weight:750;display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .card-title .mini-ico{width:28px;height:28px;border-radius:8px;background:#f1f1f2;border:1px solid #dedee1;display:grid;place-items:center}

    .kpi{display:flex;gap:16px;align-items:flex-start;min-height:124px}
    .kpi-icon{width:56px;height:56px;border-radius:16px;background:#f0f0f2;border:1px solid #e2e3e7;display:grid;place-items:center;flex-shrink:0}
    .kpi-label{font-size:18px;color:#232529;margin:0 0 8px}
    .kpi-number{font-size:56px;line-height:.95;font-weight:800;letter-spacing:-1.6px;margin:0}
    .kpi-sub{margin-top:4px;font-size:18px;color:#4d5157}
    .kpi-trend{margin-left:auto;align-self:center;font-size:18px;color:var(--ok);white-space:nowrap}

    .funnel-box{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
    .funnel{padding-top:4px}
    .trap{height:52px;margin:3px auto;background:#c6c6c8;clip-path:polygon(10% 0, 90% 0, 100% 100%, 0 100%);display:grid;place-items:center;color:#111;font-weight:700;font-size:16px}
    .trap.s1{width:100%}.trap.s2{width:84%}.trap.s3{width:66%}.trap.s4{width:46%}.trap.s5{width:30%;background:#898b90;color:#fff}
    .funnel-legend{display:grid;gap:14px;font-size:15px;color:#2f3337}
    .legend-row{display:flex;align-items:center;gap:12px;white-space:nowrap}
    .legend-line{display:inline-block;width:38px;border-top:1px solid #d7d7d8}

    .donut-layout{display:grid;grid-template-columns:210px 1fr;align-items:center;gap:16px}
    .donut{width:176px;height:176px;border-radius:50%;background:conic-gradient(#93959a 0 40%, #b0b1b4 40% 65%, #c2c3c6 65% 82%, #d2d2d4 82% 93%, #e0e0e2 93% 100%);position:relative;margin:auto}
    .donut::after{content:"";position:absolute;inset:32px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px #ececee}
    .donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}
    .donut-center strong{display:block;font-size:46px;line-height:.95;letter-spacing:-1px}
    .donut-center span{font-size:16px;color:#565a60}
    .donut-legend{display:grid;gap:12px;font-size:15px}
    .dot{width:13px;height:13px;border-radius:4px;display:inline-block;margin-right:10px;vertical-align:middle}
    .legend-item{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .legend-item em{font-style:normal;color:#303338}

    .response-wrap{display:grid;gap:12px}
    .response-number{font-size:58px;line-height:.95;font-weight:800;letter-spacing:-1.5px}
    .response-sub{font-size:17px;color:#4b4f55}
    .trend-badge{justify-self:end;background:#eef2ec;border:1px solid #dde5d9;color:#6a7d65;border-radius:10px;padding:6px 12px;font-size:16px}
    .chart{width:100%;height:190px}
    .chart text{font-size:12px;fill:#55585d}
    .chart .gridline{stroke:#d8d9dc;stroke-width:1}
    .chart .line{fill:none;stroke:#55595e;stroke-width:2.5}
    .chart .point{fill:#fff;stroke:#44484d;stroke-width:2}

    .table-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
    .tag{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;background:#f0f0f2;font-size:14px}
    table{width:100%;border-collapse:collapse;font-size:15px}
    th,td{padding:11px 10px;border-bottom:1px solid #ececef;text-align:left;vertical-align:middle}
    th{background:#f4f4f5;font-weight:700;color:#1f2226}
    tr:last-child td{border-bottom:0}
    .status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#f2f2f4;white-space:nowrap}
    .status-dot{width:10px;height:10px;border-radius:50%;background:#6a6d71}
    .badge-stage{display:inline-block;padding:8px 12px;border-radius:10px;background:#f0f0f2;white-space:nowrap}
    .table-scroll{overflow:auto}

    .ag-history{display:grid;grid-template-columns:65px minmax(0,1fr) 78px;align-items:center;gap:10px;margin:13px 0;font-size:14px}.ag-track{height:23px;background:#f1f1f3;display:flex;overflow:hidden;border-radius:5px}.ag-history b{font-size:13px}.ag-history .ag-track div{flex-shrink:0}
    .bar-list{display:grid;gap:14px;margin-top:4px}
    .bar-row{display:grid;grid-template-columns:150px 1fr 26px;gap:14px;align-items:center}
    .bar-track{height:28px;background:#efeff1;border-radius:0;overflow:hidden;position:relative}
    .bar-fill{height:100%;background:#b2b3b7}
    .mini-kpi{margin-top:16px;background:#f7f7f8;border:1px solid #ececef;border-radius:14px;padding:18px;text-align:center}
    .mini-kpi strong{display:block;font-size:56px;line-height:.95;letter-spacing:-1.2px}
    .mini-kpi span{display:block;font-size:18px;color:#43474d}

    .alert-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ececef}
    .alert-row:last-child{border-bottom:0}
    .small-circle{width:28px;height:28px;border-radius:50%;background:#f0f0f2;border:1px solid #dedfe2;display:grid;place-items:center;font-size:14px;flex-shrink:0}
    .alert-name{font-weight:600}
    .alert-sub{color:#4d5157;font-size:15px}
    .late{margin-left:auto;background:#f2f2f4;border-radius:10px;padding:6px 10px;font-size:14px;color:#4f5359;white-space:nowrap}
    .see-all{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#22252a;text-decoration:none;font-size:16px}

    .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 16px}
    .toolbar-left,.toolbar-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .btn{border:1px solid #cbccd0;background:#fff;border-radius:12px;padding:11px 14px;color:#272b30}
    .btn.primary{background:#5e6064;color:#fff;border-color:#5e6064}
    .btn.danger{background:#111;color:#fff;border-color:#111}
    .input, .select, textarea{background:#fff;border:1px solid #cbccd0;border-radius:12px;padding:11px 12px;color:#24282d}
    .input{min-width:280px}
    textarea{resize:vertical;min-height:84px}
    .two-up{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
    .three-up{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .muted{color:var(--muted)}
    .helper{font-size:14px;color:#61656b}
    .kanban{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
    .lane{background:#fafafa;border:1px solid #e4e5e8;border-radius:16px;padding:12px}
    .lane h3{margin:0 0 10px;font-size:16px}
    .lead-card{background:#fff;border:1px solid #e2e3e7;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
    .lead-card strong{display:block;margin-bottom:6px}
    .lead-card .tiny{font-size:13px;color:#61656b}
    .metric-card{background:#fff;border:1px solid #e1e2e5;border-radius:16px;padding:16px}
    .metric-card strong{display:block;font-size:34px;letter-spacing:-1px}
    .note{padding:12px 14px;border-radius:12px;background:#f7f7f8;border:1px solid #e4e5e8;color:#41454b}
    .empty{padding:24px;text-align:center;color:#666}

    dialog{border:1px solid var(--line);border-radius:18px;padding:0;width:min(860px,94vw);box-shadow:0 30px 60px rgba(0,0,0,.18)}
    dialog::backdrop{background:rgba(17,18,20,.36)}
    .modal-head{padding:18px 22px;border-bottom:1px solid #ececef;display:flex;justify-content:space-between;align-items:center}
    .modal-body{padding:18px 22px 22px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .field{display:flex;flex-direction:column;gap:7px;font-size:14px;color:#41454b}
    .field.wide{grid-column:1/-1}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    .close-btn{border:0;background:transparent;font-size:26px;line-height:1}

    .footer-note{margin-top:14px;font-size:13px;color:#62666b}
    .pill-demo{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;background:#f7f7f8;border:1px solid #e0e1e4;border-radius:999px;font-size:13px;color:#4a4f55}

    .role-control{display:grid;gap:3px;font-size:12px;color:#51555a}.role-control select{max-width:205px;padding:9px}.demo-warning{background:#fff9e9;border:1px solid #e8d7aa;color:#6a5321;border-radius:12px;padding:13px 16px;margin:10px 0 18px;font-size:14px}.permission-table td{text-align:center}.permission-table td:first-child,.permission-table th:first-child{text-align:left}.gov-stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.gov-stat strong{font-size:28px;display:block}.toolbar-left button{margin-bottom:4px}
    @media (max-width: 1200px){
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .two-col,.bottom-grid,.two-up,.three-up{grid-template-columns:1fr}
      .kanban{grid-template-columns:1fr 1fr}
    }
    @media (max-width: 920px){
      .app{grid-template-columns:1fr}
      .sidebar{border-right:0;border-bottom:1px solid var(--line)}
      .nav{flex-direction:row;overflow:auto;padding-bottom:4px}
      .nav-btn{white-space:nowrap}
      .topbar{height:auto;flex-wrap:wrap}
      .search-wrap{max-width:none}
      .top-icons{margin-left:0;width:100%;justify-content:flex-end}
      .kanban{grid-template-columns:1fr}
    }
    @media (max-width: 640px){
      .content{padding:16px 10px 28px}
      h1{font-size:32px}
      .kpi-number,.response-number,.mini-kpi strong{font-size:42px}
      .donut-layout,.funnel-box,.bar-row{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
      .input{min-width:0;width:100%}
      .search-wrap input{font-size:16px}
      .top-select{min-width:160px}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">ImobiInsight</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="search-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="#4d5055" stroke-width="2"/><path d="M16.2 16.2L21 21" stroke="#4d5055" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="globalSearch" placeholder="Buscar cliente, imóvel, lead ou atendimento..." />
      </div>
      <select class="top-select" id="periodSelect">
        <option>Últimos 30 dias</option>
        <option>Últimos 15 dias</option>
        <option>Este mês</option>
        <option>Trimestre</option>
      </select>
      <div class="top-icons">
        <button class="round-btn" title="Notificações">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M7 9a5 5 0 0 1 10 0v4l1.5 2.5H5.5L7 13V9Z" stroke="#33373c" stroke-width="1.8"/><path d="M10 18a2 2 0 0 0 4 0" stroke="#33373c" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <label class="role-control">Perfil demonstrativo <select id="demoRole" class="select" aria-label="Selecionar perfil demonstrativo"><option value="socio">Sócio / Gestor</option><option value="locacoes">Gerente de locações</option><option value="admin">Administrativo</option><option value="corretor">Corretor</option></select></label>
      </div>
    </header>
    <main class="content">
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-leads"></section>
      <section class="page" id="page-atendimentos"></section>
      <section class="page" id="page-imoveis"></section>
      <section class="page" id="page-agenciamentos"></section>
      <section class="page" id="page-corretores"></section>
      <section class="page" id="page-marketing"></section>
      <section class="page" id="page-relatorios"></section>
      <section class="page" id="page-financeiro"></section>
      <section class="page" id="page-governanca"></section>
      <section class="page" id="page-configuracoes"></section>
    </main>
  </div>
</div>

<dialog id="leadDialog">
  <div class="modal-head">
    <div>
      <strong id="dialogTitle" style="font-size:22px">Novo lead</strong>
      <div class="helper">Ambiente demonstrativo com dados fictícios.</div>
    </div>
    <button class="close-btn" id="closeDialog" aria-label="Fechar">×</button>
  </div>
  <form id="leadForm" class="modal-body">
    <div class="form-grid">
      <label class="field"><span>Cliente *</span><input class="input" name="cliente" required maxlength="80"></label>
      <label class="field"><span>Telefone</span><input class="input" name="telefone" maxlength="30"></label>
      <label class="field"><span>Imóvel *</span><input class="input" name="imovel" required maxlength="100"></label>
      <label class="field"><span>Bairro</span><input class="input" name="bairro" maxlength="50"></label>
      <label class="field"><span>Corretor responsável *</span><select class="select" name="corretor" required></select></label>
      <label class="field"><span>Origem do lead *</span><select class="select" name="origem" required></select></label>
      <label class="field"><span>Etapa *</span><select class="select" name="stage" required></select></label>
      <label class="field"><span>Tipo de imóvel</span><select class="select" name="tipo"><option>Apartamento</option><option>Casa</option><option>Sala Comercial</option><option>Loja</option><option>Conjunto Comercial</option><option>Galpão</option></select></label>
      <label class="field"><span>Próximo contato</span><input class="input" name="nextActionDate" type="date"></label>
      <label class="field"><span>Status</span><select class="select" name="status"><option>Em andamento</option><option>Pendente</option><option>Concluído</option></select></label>
      <label class="field wide"><span>Observações</span><textarea name="observations"></textarea></label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="cancelDialog">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
const STORAGE_KEY='imobiinsight_demo_v3_six_months';
const NAV_ITEMS=[
  ['dashboard','Dashboard','⌂'],
  ['leads','Leads','◎'],
  ['atendimentos','Atendimentos','◌'],
  ['imoveis','Imóveis','▣'],
  ['agenciamentos','Agenciamentos','▤'],
  ['corretores','Corretores','◠'],
  ['marketing','Marketing','◧'],
  ['relatorios','Relatórios','▥'],
  ['financeiro','Gestão financeira','R$'],
  ['governanca','Administração e Governança','♙'],
  ['configuracoes','Configurações','⚙']
];
const stages=['Novo lead','Contato inicial','Visita','Proposta','Fechado','Perdido'];
const origins=['Instagram/Facebook','Portais','WhatsApp','Indicação','Site'];
const agents=['Carlos Lima','Juliana Costa','Paulo Mendes','Bianca Silva'];
const propertiesSeed=[
  ['Sala Comercial','Centro'],['Loja','Jardim América'],['Conjunto Comercial','Av. Paulista'],['Galpão','Distrito Industrial'],['Sala Comercial','Vila Nova'],['Apartamento','Centro'],['Casa','Igara'],['Apartamento','Nossa Senhora das Graças'],['Casa','Marechal Rondon'],['Apartamento','Harmonia'],['Casa','Rio Branco'],['Casa','São José'],['Apartamento','Bela Vista'],['Loja','Centro'],['Sala Comercial','Moinhos'],['Casa','Estância Velha'],['Apartamento','Mathias Velho'],['Conjunto Comercial','Marechal Rondon']
];
const names=['Mariana Souza','Ricardo Alves','Fernanda Rocha','Eduardo Martins','Ana Beatriz','Gabriel Ferreira','Patrícia Lima','Luiz Henrique','Camila Nunes','Rafael Gomes','Bianca Duarte','Thiago Moreira','Vanessa Ribeiro','Marcelo Costa','Cláudia Lima','João Pedro','Isabela Martins','Gustavo Azevedo','Renata Oliveira','Leonardo Campos','Bruna Farias','Aline Moraes','Pedro Henrique','Fábio Nogueira','Larissa Melo','Julio Cesar','Paula Fernandes','Renan Teixeira','Priscila Santos','Murilo Pires','Cristiane Lopes','Diego Souza','Carolina Freitas','Roberto Nunes','Helena Barreto','Felipe Gonçalves','Mônica Duarte','Daniel Vieira','Sabrina Rocha','Márcio Leal'];
const companies=['Campanha Centro 01','Campanha Apartamento 2D','Campanha Locação Comercial','Campanha MCMV','Campanha Sala Comercial','Campanha Casa com Pátio'];
let page='dashboard';
let editingId=null;
let searchTerm='';
let db=loadDB();

function loadDB(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const data=buildDemoData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
function buildDemoData(){
  const leads=[];
  const exactCounts={'Novo lead':12,'Contato inicial':79,'Visita':24,'Proposta':10,'Fechado':13,'Perdido':0};
  const originCounts={'Instagram/Facebook':55,'Portais':35,'WhatsApp':23,'Indicação':15,'Site':10};
  const responseSeries=[31,22,19,16,18];
  const datePoints=['2025-01-01','2025-01-08','2025-01-15','2025-01-22','2025-01-29'];
  const firstRows=[

function metrics(){
  const leads=db.leads;
  const total=leads.length;
  const first=leads.filter(l=>l.stage!=='Novo lead').length;
  const visitOrMore=leads.filter(l=>['Visita','Proposta','Fechado'].includes(l.stage)).length;
  const proposalOrMore=leads.filter(l=>['Proposta','Fechado'].includes(l.stage)).length;
  const closed=leads.filter(l=>l.stage==='Fechado').length;
  const originsCount=origins.map(o=>({name:o,count:leads.filter(l=>l.origem===o).length,pct:Math.round(leads.filter(l=>l.origem===o).length/total*100)}));
  const avgResponse=Math.round(leads.filter(l=>typeof l.responseMinutes==='number').reduce((a,b)=>a+b.responseMinutes,0)/Math.max(1,leads.filter(l=>typeof l.responseMinutes==='number').length));
  const recent=[...leads].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,5);
  const closedByAgent=agents.map(a=>({name:a,count:leads.filter(l=>l.corretor===a && l.stage==='Fechado').length})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
  const noReturn=[...leads].filter(l=>!['Fechado','Perdido'].includes(l.stage) && (new Date('2025-01-29T23:59:00')-new Date(l.updatedAt))/86400000>3).sort((a,b)=>new Date(a.updatedAt)-new Date(b.updatedAt));
  return {total,first,visitOrMore,proposalOrMore,closed,originsCount,avgResponse,recent,closedByAgent,noReturn};
}

function lineChart(){
  const points=[31,22,19,16,18];
  const labels=['01/01','08/01','15/01','22/01','29/01'];
  const max=40, min=0, w=320, h=170, left=34, bottom=28, top=10, right=10;
  const plotW=w-left-right, plotH=h-top-bottom;
  const xy=points.map((v,i)=>{
    const x=left+(plotW/(points.length-1))*i;
    const y=top + (1-(v-min)/(max-min))*plotH;
    return [x,y];
  });
  const d=xy.map((p,i)=>`${i?'L':'M'} ${p[0]} ${p[1]}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${[0,10,20,30,40].map(v=>{const y=top + (1-(v-min)/(max-min))*plotH; return `<line class="gridline" x1="${left}" x2="${w-right}" y1="${y}" y2="${y}"/><text x="0" y="${y+4}">${v} min</text>`;}).join('')}
    <path class="line" d="${d}"/>
    ${xy.map((p,i)=>`<circle class="point" cx="${p[0]}" cy="${p[1]}" r="4.5"/><text x="${p[0]-12}" y="${h-6}">${labels[i]}</text>`).join('')}
  </svg>`;
}

function parseDelimited(text){
 text=String(text||'').replace(/^\ufeff/,'');
 const firstLine=text.split(/\r?\n/).find(x=>x.trim())||'';
 const separator=[';',',','\t'].map(sep=>({sep,n:(firstLine.match(new RegExp(sep==='\t'?'\\t':sep===';'?';':',','g'))||[]).length})).sort((a,b)=>b.n-a.n)[0].sep;
 let result=[],row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted;}
  else if(c===separator&&!quoted){row.push(field);field='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>String(x).trim()))result.push(row);row=[];field='';}
  else field+=c;
 }
 if(quoted)throw Error('Aspas não fechadas no CSV.');
 row.push(field);if(row.some(x=>String(x).trim()))result.push(row);

async function handleImportFile(e){
 pendingImport=null;const f=e.target.files?.[0];if(!f)return;
 const prev=document.getElementById('importPreview');const confirm=document.getElementById('confirmImport');confirm.disabled=true;
 if(!/\.(csv|txt)$/i.test(f.name)){prev.textContent='Formato não suportado neste protótipo. Exporte a planilha do Excel em CSV UTF-8 e selecione esse arquivo.';return;}
 if(f.size>4*1024*1024){prev.textContent='Arquivo muito grande (limite 4 MB). Divida a planilha em lotes menores.';return;}
 try{
  const kind=document.getElementById('importKind').value,s=IMPORT_SCHEMAS[kind];
  const rows=parseDelimited(await f.text());if(rows.length<2)throw Error('O arquivo precisa ter cabeçalho e ao menos uma linha de dados.');
  const cols=rows[0].map(v=>s.aliases[normalizeColumn(v)]||s.keys.find(k=>normalizeColumn(k)===normalizeColumn(v))||'');
  const missing=s.req.filter(x=>!cols.includes(x));if(missing.length)throw Error('Colunas obrigatórias não identificadas: '+missing.join(', ')+'. Baixe o modelo deste tipo e ajuste os cabeçalhos.');
  let objects=rows.slice(1).map((r,i)=>({i:i+2,obj:Object.fromEntries(cols.map((k,j)=>[k,r[j]||'']).filter(([k])=>k))})).filter(x=>Object.values(x.obj).some(v=>String(v).trim()));
  if(objects.length===0)throw Error('Não há linhas com dados.');
  const issues=[];
  for(const {i,obj} of objects){
   for(const required of s.req){if(!String(obj[required]??'').trim()) issues.push(`Linha ${i}: campo obrigatório '${required}' vazio.`);}
   if(kind==='leads' && obj.stage && !stages.includes(obj.stage)) issues.push(`Linha ${i}: etapa '${obj.stage}' inválida. Valores: ${stages.join(', ')}.`);
   if(kind==='leads' && obj.origem && !origins.includes(obj.origem)) issues.push(`Linha ${i}: origem '${obj.origem}' fora dos canais padronizados: ${origins.join(', ')}.`);
   if(kind==='cash' && obj.tipo && !['Entrada','Saída'].includes(obj.tipo)) issues.push(`Linha ${i}: tipo deve ser Entrada ou Saída.`);
   if(kind==='cash' && obj.status && !['Realizado','Previsto'].includes(obj.status)) issues.push(`Linha ${i}: status deve ser Realizado ou Previsto.`);
   if(kind==='deals' && obj.tipo && !['Venda','Locação'].includes(obj.tipo)) issues.push(`Linha ${i}: modalidade deve ser Venda ou Locação.`);
   if(kind==='activities' && obj.etapa && !stages.includes(obj.etapa)) issues.push(`Linha ${i}: etapa '${obj.etapa}' inválida.`);
   if(kind==='agenciamentos' && obj.modalidade && !['Venda','Locação'].includes(obj.modalidade))issues.push(`Linha ${i}: modalidade deve ser Venda ou Locação.`);
   const dateFields=kind==='agenciamentos'?['dataCadastro']:kind==='leads'?['createdAt','updatedAt','nextActionDate']:kind==='deals'?['dataFechamento']:kind==='cash'?['data']:kind==='activities'?['data','proximoContato']:[];
   for(const field of dateFields){ const val=String(obj[field]||'').trim(); if(val && !/^(\d{4}-\d{2}-\d{2}|\d{2}\/\d{2}\/\d{4})(?:[ T]\d{2}:\d{2}(?::\d{2})?)?$/.test(val))issues.push(`Linha ${i}: data inválida em '${field}': ${val}.`); }
   const numericFields=kind==='agenciamentos'?['valorAnuncio']:kind==='deals'?['valor','comissao']:kind==='cash'?['valor']:kind==='campaigns'?['leads','custo','cpl','fechados']:kind==='activities'?['tempoRespostaMin']:[];
   for(const field of numericFields){ const val=String(obj[field]||'').trim(); if(val && !/^\s*(?:R\$\s*)?[0-9.,]+\s*$/.test(val)) issues.push(`Linha ${i}: valor numérico inválido em '${field}': ${val}.`); }
  }
  if(issues.length) throw Error(`Foram encontrados ${issues.length} problema(s). Corrija antes de importar:\n`+issues.slice(0,12).join('\n')+(issues.length>12?'\n...':''));
  const ignored=rows[0].filter((_,i)=>!cols[i]);pendingImport={kind,filename:f.name,objects};
  prev.innerHTML=`<p><b>${objects.length} registros</b> identificados em <b>${esc(f.name)}</b>. ${ignored.length?`Colunas não reconhecidas (serão ignoradas): ${ignored.map(esc).join(', ')}.`:'Todas as colunas foram reconhecidas.'}</p><p class="helper">Campos identificados: ${cols.filter(Boolean).map(esc).join(' • ')}</p>${rowPreview(rows)}`;
  confirm.disabled=false;
 }catch(err){prev.style.whiteSpace='pre-wrap';prev.textContent='Não foi possível ler o arquivo: '+err.message;}
}
function dedupeKey(row,kind){
 const s=v=>String(v||'').toLowerCase().replace(/\W/g,'');
 if(kind==='leads')return s(row.telefone)?`tel:${s(row.telefone)}`:`nome:${s(row.cliente)}:imovel:${s(row.imovel)}`;
 if(kind==='properties')return s(row.code);
 if(kind==='deals')return s(row.contractId);
 if(kind==='cash')return s(row.entryId);
 if(kind==='activities')return s(row.activityId);
 if(kind==='agenciamentos')return s(row.agenciamentoId);
 return s(row.nome)+':'+s(row.canal);
}
function canonicalRow(row,kind){
 const cleaned={};for(const [k,v]of Object.entries(row))cleaned[k]=String(v??'').trim();
 if(kind==='leads'){
  const stage=cleaned.stage||'Novo lead';
  return {...cleaned,stage:stages.includes(stage)?stage:'Novo lead',status:stage==='Fechado'?'Concluído':stage==='Novo lead'?'Pendente':'Em andamento',createdAt:parseDateValue(cleaned.createdAt)||new Date().toISOString(),updatedAt:parseDateValue(cleaned.updatedAt)||parseDateValue(cleaned.createdAt)||new Date().toISOString(),responseMinutes:stage==='Novo lead'?null:18};
 }
 if(kind==='properties')return {...cleaned,code:cleaned.code.toUpperCase(),status:cleaned.status||'Disponível'};
 if(kind==='deals')return {...cleaned,valor:moneyNum(cleaned.valor),comissao:moneyNum(cleaned.comissao),dataFechamento:parseDateValue(cleaned.dataFechamento)};
 if(kind==='cash')return {...cleaned,valor:moneyNum(cleaned.valor),data:parseDateValue(cleaned.data).slice(0,10)};
 if(kind==='campaigns')return {...cleaned,leads:Number(cleaned.leads)||0,custo:moneyNum(cleaned.custo),cpl:moneyNum(cleaned.cpl),fechados:Number(cleaned.fechados)||0};
 if(kind==='agenciamentos')return {...cleaned,valorAnuncio:moneyNum(cleaned.valorAnuncio),dataCadastro:parseDateValue(cleaned.dataCadastro).slice(0,10)};
 if(kind==='activities')return {...cleaned,data:parseDateValue(cleaned.data),tempoRespostaMin:Number(cleaned.tempoRespostaMin)||null};
 return cleaned;
}
function commitImport(){
 if(!pendingImport)return;
 ensureImportStore();const {kind,filename,objects}=pendingImport;
 const dest=kind==='leads'?db.leads:kind==='properties'?db.properties:kind==='deals'?db.deals:kind==='cash'?db.cashEntries:kind==='campaigns'?db.campaigns:kind==='agenciamentos'?db.agenciamentos:db.activities;
 let added=0,updated=0,skipped=0;
 for(const item of objects){
  const row=canonicalRow(item.obj,kind);
  if(kind==='deals'||kind==='cash')row.reviewStatus='Pendente';
  const k=dedupeKey(row,kind);
  if(!k||k==='nome::imovel:'){skipped++;continue;}
  const pos=dest.findIndex(x=>dedupeKey(x,kind)===k);
  if(pos>=0){dest[pos]={...dest[pos],...row};updated++;}
  else{
   if(kind==='leads')row.id=Math.max(0,...db.leads.map(x=>Number(x.id)||0))+1;
   dest.push(row);added++;
  }
  if(kind==='agenciamentos'){syncAgenciamentoProperty(row);}
  if(kind==='deals'){
   const lead=db.leads.find(l=>(String(l.id)===String(row.leadId)&&row.leadId)|| (normalizeColumn(l.cliente)===normalizeColumn(row.cliente)&&normalizeColumn(l.imovel)===normalizeColumn(row.imovel)));
   if(lead){lead.stage='Fechado';lead.status='Concluído';lead.updatedAt=row.dataFechamento||lead.updatedAt;}
  }
  if(kind==='activities'){
   const lead=db.leads.find(l=>(String(l.id)===String(row.leadId)&&row.leadId)|| (normalizeColumn(l.cliente)===normalizeColumn(row.cliente)&&normalizeColumn(l.imovel)===normalizeColumn(row.imovel)));
   if(lead){if(stages.includes(row.etapa)){lead.stage=row.etapa;lead.status=row.etapa==='Fechado'?'Concluído':'Em andamento';}lead.updatedAt=row.data||lead.updatedAt;if(row.proximoContato)lead.nextActionDate=row.proximoContato;if(Number.isFinite(row.tempoRespostaMin)&&row.tempoRespostaMin>0)lead.responseMinutes=row.tempoRespostaMin;}
  }
 }
 db.importLog.push({time:new Date().toLocaleString('pt-BR'),kind:importLabels[kind],file:filename,added,updated,skipped});
 try{saveDB();}catch(err){alert('Armazenamento do navegador insuficiente. Exporte o backup e importe arquivos menores.');return;}
 auditEvent('Importação CSV',filename,`${added} incluídos; ${updated} atualizados; ${skipped} ignorados`);pendingImport=null;renderPage();setActivePage('importacoes');alert(`Importação concluída: ${added} novos, ${updated} atualizados, ${skipped} ignorados.`);
}

function financialCategory(x){

function monthlyFinancialSnapshot(month, cash, deals){
 const rows=cash.filter(x=>x.status==='Realizado' && !['Pendente','Revisar'].includes(x.reviewStatus) && (!month||String(x.data).slice(0,7)===month));
 const sum=(a)=>a.reduce((v,x)=>v+(Number(x.valor)||0),0);
 const salesIn=sum(rows.filter(x=>x.tipo==='Entrada' && financialCategory(x)==='Vendas'));
 const salesOut=sum(rows.filter(x=>x.tipo==='Saída' && financialCategory(x)==='Vendas'));
 const rentAdmin=sum(rows.filter(x=>x.tipo==='Entrada' && x.categoria==='Locações - administração recorrente'));
 const rentFirstGross=sum(rows.filter(x=>x.tipo==='Entrada' && x.categoria==='Locações - primeiro aluguel'));
 const rentOther=sum(rows.filter(x=>x.tipo==='Entrada'&&financialCategory(x)==='Locações'))-rentAdmin-rentFirstGross;
 const rentOut=sum(rows.filter(x=>x.tipo==='Saída'&&financialCategory(x)==='Locações'));
 const opOut=sum(rows.filter(x=>x.tipo==='Saída'&&financialCategory(x)==='Estrutura'));
 const entries=sum(rows.filter(x=>x.tipo==='Entrada'));
 const expenses=sum(rows.filter(x=>x.tipo==='Saída'));
 const periodDeals=deals.filter(d=>!['Pendente','Revisar'].includes(d.reviewStatus) && (!month||String(d.dataFechamento||'').slice(0,7)===month));
 const sales=periodDeals.filter(d=>d.tipo==='Venda');
 const rents=periodDeals.filter(d=>d.tipo==='Locação');
 const vgv=sum(sales);
 const newRentTotal=sum(rents);
 const rank=(items)=>Object.values(items.reduce((obj,d)=>{const name=d.corretor||'Não informado';if(!obj[name])obj[name]={name,amount:0,quantity:0};obj[name].amount+=Number(d.valor)||0;obj[name].quantity++;return obj;},{})).sort((a,b)=>b.amount-a.amount);
 return {entries,expenses,balance:entries-expenses,salesIn,salesOut,rentAdmin,rentFirstGross,rentOther,rentOut,opOut,vgv,newRentTotal,salesCount:sales.length,rentCount:rents.length,rankSales:rank(sales),rankRents:rank(rents),rentNet:rentAdmin+rentFirstGross+rentOther-rentOut-opOut,salesNet:salesIn-salesOut};
}

const FIN_CATEGORIES=['Vendas - comissões recebidas','Vendas - distribuição aos sócios','Locações - administração recorrente','Locações - primeiro aluguel','Locações - repasse da intermediação','Despesas - pessoal','Despesas - estrutura','Despesas - marketing','Despesas - tecnologia e outras'];
function financialInput(name,label,value,type='text',opts=null,required=true){
 const v=String(value??'');
 const ctrl=opts?`<select class="select" name="${name}" ${required?'required':''}>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="input" name="${name}" type="${type}" ${type==='number'?'step="0.01" min="0"':''} value="${esc(v)}" ${required?'required':''}>`;
 return `<label class="field"><span>${label}${required?' *':''}</span>${ctrl}</label>`;
}
function openFinanceEditor(kind,key=null){
 ensureImportStore();financialEditing={kind,key};const d=financialDialog(),arr=kind==='deals'?db.deals:db.cashEntries;

 }else{
  d.querySelector('#financialFields').innerHTML=`${financialInput('entryId','Código único do lançamento',item?.entryId||'CX-'+Date.now())}${financialInput('data','Data da movimentação',String(item?.data||new Date().toISOString()).slice(0,10),'date')}${financialInput('tipo','Entrada ou saída',item?.tipo||'Entrada','text',['Entrada','Saída'])}${financialInput('categoria','Categoria financeira',item?.categoria||FIN_CATEGORIES[0],'text',FIN_CATEGORIES)}${financialInput('valor','Valor realizado ou previsto',item?.valor??'', 'number')}${financialInput('status','Situação',item?.status||'Realizado','text',['Realizado','Previsto'])}${financialInput('descricao','Descrição',item?.descricao||'','text',null,false)}${financialInput('contractId','Código do contrato relacionado (se houver)',item?.contractId||'','text',null,false)}`;

function saveFinancialEditor(e){
 e.preventDefault();const {kind,key}=financialEditing||{};if(!kind)return;
 const row=Object.fromEntries(new FormData(e.target).entries());const idField=kind==='deals'?'contractId':'entryId';
 const arr=kind==='deals'?db.deals:db.cashEntries;const id=row[idField].trim();
 if(!id){alert('O identificador é obrigatório.');return;}
 const match=arr.findIndex(x=>String(x[idField])===id);
 if(match>=0 && (!key || String(arr[match][idField])!==key)){alert('Já existe registro com este código. Edite-o em vez de criar duplicidade.');return;}
 if(Number(row.valor)<=0 || !Number.isFinite(Number(row.valor))){alert('Informe um valor positivo.');return;}
 const clean=canonicalRow(row,kind);clean.reviewStatus='Pendente';
 if(key){const old=arr.findIndex(x=>String(x[idField])===String(key));if(old<0){alert('Registro não encontrado.');return;}arr[old]={...arr[old],...clean};}
 else arr.push(clean);
 try{saveDB();}catch(err){alert('Não foi possível salvar. Faça backup e libere espaço.');return;}
 financialDialog().close();auditEvent('Cadastro/edição de '+(kind==='deals'?'contrato':'lançamento'),id,'Pendente de conferência');renderPage();setActivePage('financeiro');
}
function deleteFinanceRecord(kind,key){
 if(!confirm('Excluir este registro fictício? A alteração será refletida nos indicadores. Recomenda-se realizar backup antes.'))return;
 const arr=kind==='deals'?db.deals:db.cashEntries;
 const idField=kind==='deals'?'contractId':'entryId';
 const i=arr.findIndex(x=>String(x[idField])===String(key));if(i<0)return;
 arr.splice(i,1);saveDB();auditEvent('Exclusão de '+(kind==='deals'?'contrato':'lançamento'),key,'Registro removido da demonstração');renderPage();setActivePage('financeiro');
}

function applyDemoRole(){
 const allowed=GOV_ROLES[demoRole].pages;
 document.querySelectorAll('.nav-btn').forEach(btn=>{btn.hidden=!allowed.includes(btn.dataset.page);btn.style.display=allowed.includes(btn.dataset.page)?'flex':'none';});
 const restrictedFinance=document.getElementById('page-financeiro');
 if(demoRole==='admin'){
 restrictedFinance.innerHTML=`<div class="hero"><h1>Registro financeiro</h1><p class="subtitle">Entrada operacional sem acesso ao consolidado dos sócios.</p></div><div class="demo-warning">Perfil demonstrativo, sem proteção efetiva dos dados. Apenas arquivos fictícios.</div><div class="card"><div class="card-title">Atualização de informações</div><p>Cadastre contratos ou movimentações. Os novos registros ficarão pendentes de conferência na área de Governança.</p><div class="toolbar-left"><button class="btn primary" id="adminNewDeal">Registrar venda / locação</button><button class="btn primary" id="adminNewCash">Registrar entrada / saída</button><button class="btn" id="adminImport">Importar CSV</button></div></div>`;
 restrictedFinance.querySelector('#adminNewDeal').onclick=()=>openFinanceEditor('deals');restrictedFinance.querySelector('#adminNewCash').onclick=()=>openFinanceEditor('cash');restrictedFinance.querySelector('#adminImport').onclick=()=>setActivePage('importacoes');
 }
 if(!allowed.includes(page)){page=allowed[0];document.querySelectorAll('.page').forEach(n=>n.classList.toggle('active',n.id==='page-'+page));}
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 // Exibe aviso em qualquer tela acessível, evitando confusão com login real.
 const current=document.getElementById('page-'+page);
 if(current&&page!=='governanca'&&demoRole!=='socio')current.insertAdjacentHTML('afterbegin',`<div class="demo-warning"><strong>Prévia do perfil ${esc(GOV_ROLES[demoRole].name)}:</strong> menus ocultos são apenas uma simulação visual; não use dados reais nem considere este seletor um controle de acesso.</div>`);
}
const renderFullBeforeGovernance=renderPage;
renderPage=function(){renderFullBeforeGovernance();renderGovernancePage();applyDemoRole();};
const originalSetActivePage=setActivePage;
setActivePage=function(next){if(!GOV_ROLES[demoRole].pages.includes(next))next=GOV_ROLES[demoRole].pages[0];originalSetActivePage(next);};
const rolePicker=document.getElementById('demoRole');
rolePicker.onchange=e=>{demoRole=e.target.value;renderNav();renderPage();};
const existingResetDemo=resetDemo;
resetDemo=function(){existingResetDemo();ensureGovernance();renderNav();renderPage();};

function ensureAgenciamentos(){
 if(!Array.isArray(db.agenciamentos)){
  db.agenciamentos=AG_SEED.map(x=>({...x}));
  // Mantém registros históricos existentes; a lista de imóveis pode ter catálogo anterior.
  for(const x of db.agenciamentos)syncAgenciamentoProperty(x);
  try{saveDB()}catch(e){console.warn('Falha ao salvar base de agenciamentos',e)}
 }
}
function syncAgenciamentoProperty(x){
 db.properties??=[];
 const code=String(x.codigoImovel||'').trim();if(!code)return;
 const i=db.properties.findIndex(p=>String(p.code||'').trim().toLowerCase()===code.toLowerCase());
 const record={code,name:x.imovel||'Imóvel captado',bairro:x.bairro||'',tipo:x.modalidade==='Locação'?'Locação':'Venda',price:moneyBRL(x.valorAnuncio)+(x.modalidade==='Locação'?'/mês':''),owner:'Proprietário fictício',status:x.status||'Disponível'};
 if(i<0)db.properties.push(record);else db.properties[i]={...db.properties[i],...record};
}

 <div class="demo-warning">Dados simulados de maio a outubro de 2026. As metas e o requisito de 3 captações semanais para a roleta são referências exploratórias, não avaliação real de profissionais. A importação é manual por CSV; não há conexão direta com o portal da imobiliária.</div>

 <div class="grid four-up" style="margin-bottom:18px;grid-template-columns:repeat(4,minmax(0,1fr))"><div class="metric-card"><div class="helper">Novas captações no filtro</div><strong>${filt.length}</strong><span class="helper">Variação anterior: ${diff==='—'?'sem base':(Number(diff)>0?'+':'')+diff+'%'}</span></div><div class="metric-card"><div class="helper">Captações de venda no mês</div><strong>${sales.length}</strong><span class="helper">Contagem de novos imóveis</span></div><div class="metric-card"><div class="helper">Captações de locação no mês</div><strong>${rentals.length}</strong><span class="helper">Contagem de novos imóveis</span></div><div class="metric-card"><div class="helper">Captações ainda disponíveis</div><strong>${available}</strong><span class="helper">Somente os registros selecionados</span></div></div>
 <div class="grid two-up" style="margin-bottom:18px"><div class="card"><div class="card-title">Evolução de captações — últimos seis meses</div><p class="helper">Barras por mês, sem valores monetários: cada unidade representa um imóvel agenciado.</p><div style="display:flex;gap:12px;align-items:center;font-size:13px;margin-bottom:14px"><span>◼ Vendas (cinza escuro)</span><span style="color:#888">◼ Locações (cinza claro)</span></div>${hist.map(x=>`<div class="ag-history"><span>${esc(x.m)}</span><div class="ag-track"><div style="background:#74777d;width:${x.s/maxHist*100}%;height:100%"></div><div style="background:#c7c8cc;width:${x.l/maxHist*100}%;height:100%"></div></div><b>${x.s} / ${x.l}</b></div>`).join('')}</div>
 <div class="card"><div class="card-title">Captações por profissional — ${esc(agFilterMonth)}</div><p class="helper">O mesmo imóvel não é somado duas vezes no total de captações. Atribuições ao corretor e ao agenciador são apresentadas separadamente.</p><div class="table-scroll"><table><thead><tr><th>Profissional</th><th>Função</th><th>Venda</th><th>Locação</th><th>Total</th></tr></thead><tbody>${ranking.slice(0,12).map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.role)}</td><td>${x.venda}</td><td>${x.locacao}</td><td><b>${x.total}</b></td></tr>`).join('')}</tbody></table></div></div></div>
 <div class="card" style="margin-bottom:18px"><div class="card-title">Referência de captação semanal para recebimento de leads — VENDAS</div><p class="helper">Entrevistado mencionou três agenciamentos na semana anterior para participação na distribuição de leads. A tabela mostra apenas a contagem semanal da simulação, não a elegibilidade real: é necessário verificar as regras, a semana de referência e a qualidade do cadastro.</p><div class="table-scroll"><table><thead><tr><th>Semana de início (segunda)</th><th>Corretor</th><th>Agenciamentos</th><th>Referência</th></tr></thead><tbody>${eligible.flatMap(x=>x.vals.map(v=>`<tr><td>${esc(x.w)}</td><td>${esc(v.c)}</td><td>${v.n}</td><td><span class="badge-stage">${v.n>=3?'Atingiu 3':'Abaixo de 3'}</span></td></tr>`)).join('')||'<tr><td colspan="4">Sem agenciamentos de venda no período.</td></tr>'}</tbody></table></div></div>
 <div class="card"><div class="table-head"><div class="card-title">Novos imóveis cadastrados e evolução do estoque</div><button class="btn" id="agDownloadModel">Modelo CSV do portal</button></div><p class="helper">Origem preferencial: exportação semanal do cadastro de imóveis do site/CRM, com código único, data do primeiro cadastramento, modalidade, corretor responsável e agenciador. Exporte somente novos cadastros ou reimporte registros corrigidos com o mesmo ID.</p>${agTable(filt.slice().sort((a,b)=>b.dataCadastro.localeCompare(a.dataCadastro)).slice(0,100))}</div>`;
 el.querySelector('#agMonth').onchange=e=>{agFilterMonth=e.target.value;renderAgenciamentosPage()};el.querySelector('#agType').onchange=e=>{agFilterType=e.target.value;renderAgenciamentosPage()};

function getPreviousMonth(month){const [y,m]=month.split('-').map(Number);return (m===1?y-1:y)+'-'+String(m===1?12:m-1).padStart(2,'0')}
function openAgEditor(id=''){
 const old=db.agenciamentos.find(x=>x.agenciamentoId===id)||{};
 const s=IMPORT_SCHEMAS.agenciamentos,dlg=document.getElementById('agenciamentoDialog');
 const options=(arr,v)=>arr.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('');
 dlg.innerHTML=`<div class="modal-head"><h2 style="margin:0">${id?'Editar':'Novo'} agenciamento</h2><button class="close-btn" type="button" id="agClose" aria-label="Fechar">×</button></div><form id="agForm" class="modal-body"><div class="form-grid">${s.keys.map(k=>`<label class="field">${esc(k)}${s.req.includes(k)?' *':''}${k==='modalidade'?`<select class="select" name="${k}">${options(['Venda','Locação'],old[k]||'Venda')}</select>`:k==='status'?`<select class="select" name="${k}">${options(['Disponível','Em negociação','Vendido','Locado','Inativo'],old[k]||'Disponível')}</select>`:`<input class="input" style="min-width:0;width:100%" name="${k}" value="${esc(old[k]??'')}" ${k==='dataCadastro'?'type="date"':''} ${s.req.includes(k)?'required':''} ${k==='agenciamentoId'&&id?'readonly':''}>`}</label>`).join('')}</div><p class="helper">O código do imóvel deve ser o mesmo identificador exportado pelo portal. Reutilizar o ID atualiza o cadastro, sem nova captação.</p><div class="modal-actions"><button type="button" class="btn" id="agCancel">Cancelar</button><button type="submit" class="btn primary">Salvar agenciamento</button></div></form>`;
 dlg.querySelector('#agClose').onclick=()=>dlg.close();dlg.querySelector('#agCancel').onclick=()=>dlg.close();
 dlg.querySelector('#agForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const obj={};for(const [k,v]of f.entries())obj[k]=String(v).trim();if(db.agenciamentos.some(x=>x.agenciamentoId===obj.agenciamentoId&&x.codigoImovel!==obj.codigoImovel)){alert('Este identificador já pertence a outro imóvel.');return;}const row=canonicalRow(obj,'agenciamentos');const pos=db.agenciamentos.findIndex(x=>x.agenciamentoId===obj.agenciamentoId);if(pos<0)db.agenciamentos.push(row);else db.agenciamentos[pos]={...db.agenciamentos[pos],...row};syncAgenciamentoProperty(row);saveDB();auditEvent(pos<0?'Cadastro de agenciamento':'Atualização de agenciamento',row.agenciamentoId,'Modalidade '+row.modalidade);dlg.close();renderPage();setActivePage('agenciamentos')};dlg.showModal();
}
